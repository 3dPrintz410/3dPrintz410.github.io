<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>3DPrintz410</title>
  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>
  <!-- Navigation -->
  <nav>
    <ul>
      <li><a href="#gallery">Gallery</a></li>
      <li><a href="#timelapse">Timelapse</a></li>
      <li><a href="#contact">Contact</a></li>
    </ul>
  </nav>

  <!-- Header -->
  <header>
    <img src="images/Image1.png" alt="3DPrintz410 Logo" class="logo">
    <h1>3DPrintz410</h1>
    <p>My 3D Printing Portfolio</p>
  </header>

  <!-- Gallery -->
  <section id="gallery">
    <h2>My Prints</h2>
    <div class="gallery-grid">
      <img src="images/print1.jpg" alt="Print 1">
      <img src="images/print2.jpg" alt="Print 2">
      <img src="images/print3.jpg" alt="Print 3">
      <!-- Add more images here -->
    </div>
  </section>

  <!-- Timelapse -->
  <section id="timelapse">
    <h2>Timelapse Videos</h2>
    <div class="video-grid">
      <iframe width="560" height="315" src="https://www.youtube.com/embed/YOUR_VIDEO_ID" frameborder="0" allowfullscreen></iframe>
      <iframe width="560" height="315" src="https://www.youtube.com/embed/YOUR_VIDEO_ID" frameborder="0" allowfullscreen></iframe>
    </div>
  </section>

  <!-- Contact -->
  <section id="contact">
    <h2>Contact Me</h2>
    <p>Email: <a href="mailto:ipwnedroot@pm.me">ipwnedroot@pm.me</a></p>
    <p>Discord: khalid#1234</p>
  </section>

  <!-- Footer -->
  <footer>
    <p>&copy; 2026 3DPrintz410</p>
  </footer>
</body>
</html>
